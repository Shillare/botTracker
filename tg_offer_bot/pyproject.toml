[project]
name = "tg-offer-bot"
version = "1.1.0"
description = "Telegram-бот для продажи NFT-подарков за Stars с поддержкой бизнес-аккаунтов"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31.0,<4.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]
# RUF001/002/003 ловят «неоднозначные» кириллические а/с/о/е/у в обычном
# русском тексте (докстринги, комментарии) и в намеренных омоглифах карточки.
# Для русскоязычного проекта это ожидаемый шум — см. app/utils/text.py.
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/__init__.py" = ["F401"]
"app/database/__init__.py" = ["F401"]
"app/services/__init__.py" = ["F401"]
"app/keyboards/__init__.py" = ["F401"]
"app/handlers/__init__.py" = ["F401"]
